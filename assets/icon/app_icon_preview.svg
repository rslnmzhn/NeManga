  <path d="m189 358 10 24 24 10-24 10-10 24-10-24-24-10 24-10Z" fill="#FFD083"/>
  <path d="m833 292 8 20 20 8-20 8-8 20-8-20-20-8 20-8Z" fill="#FFB0C8"/>
  <circle cx="807" cy="465" r="9" fill="#FFD083"/>
  <circle cx="211" cy="510" r="6" fill="#A99AD8"/>
</svg>
